<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <!-- This is a client-rendered SPA: crawlers and social scrapers that don't
         run JS only ever see these static tags, so they must describe the
         current lead product (Alerts), not the older flat-fee concierge. -->
    <title>AptPilot — Instant No-Fee NYC Apartment Alerts</title>
    <meta name="description" content="No-fee NYC apartments lease within hours. AptPilot texts and emails you the moment a listing matches your criteria — $29/mo, 3-day free trial, cancel anytime." />
    <meta name="keywords" content="no fee apartments NYC, NYC apartment alerts, no broker fee NYC, New York City rentals, StreetEasy alerts, NYC rental help, find apartment NYC" />
    <meta name="author" content="AptPilot" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AptPilot" />
    <meta property="og:url" content="https://aptpilot.vercel.app/" />
    <meta property="og:title" content="AptPilot — Instant No-Fee NYC Apartment Alerts" />
    <meta property="og:description" content="Get texted the second a no-fee NYC listing matches your search. $29/mo, 3-day free trial." />
    <meta property="og:image" content="https://aptpilot.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AptPilot — Instant No-Fee NYC Apartment Alerts" />
    <meta name="twitter:description" content="Get texted the second a no-fee NYC listing matches your search. $29/mo, 3-day free trial." />
    <meta name="twitter:image" content="https://aptpilot.vercel.app/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://aptpilot.vercel.app/" />

    <!-- Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon + installed-app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installable web app. iOS ignores most of the manifest, so the
         apple-mobile-web-app-* meta tags below are what actually control
         standalone mode and the status bar on iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AptPilot" />

    <!-- Structured data. Only claims that are literally true are listed here:
         no aggregateRating / reviewCount, since there are no real reviews yet
         and fabricating them is both a policy violation and a trust risk. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "AptPilot Alerts",
      "serviceType": "No-fee apartment listing alerts",
      "description": "Instant SMS and email alerts when a no-broker-fee NYC rental listing matches your search criteria.",
      "url": "https://aptpilot.vercel.app/",
      "areaServed": { "@type": "City", "name": "New York City" },
      "provider": { "@type": "Organization", "name": "AptPilot", "url": "https://aptpilot.vercel.app/" },
      "offers": {
        "@type": "Offer",
        "price": "29.00",
        "priceCurrency": "USD",
        "url": "https://aptpilot.vercel.app/pricing",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>

    <!-- Theme color (mobile browser bar) — matches the paper background -->
    <meta name="theme-color" content="#FAF6EF" />

    <!-- Google Search Console verification -->
    <!-- Replace YOUR_CODE_HERE with the code Google gives you in Search Console -->
    <meta name="google-site-verification" content="wNbGStXDdW2nt-xqA9Nd2aTioxJ24rfcbraBtu4O-iA" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
