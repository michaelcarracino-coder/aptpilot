<!-- Maskable source for icon-maskable-512.png.
     Full-bleed --paper background (Android and iOS crop maskable icons to a
     circle or squircle, so the background has to reach every edge) with the
     keyhole held inside the inner ~50% so no mask can clip it. Same mark as
     favicon.svg, scaled down for that safe area. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#FAF6EF"/>
  <g transform="translate(25.02 16.2) scale(0.1317)" fill="#C6A15B">
    <circle cx="53" cy="50" r="49"/>
    <path d="M26.5 92 L0 239 A53 12.6 0 0 0 106 239 L79.5 92 Z"/>
  </g>
</svg>
