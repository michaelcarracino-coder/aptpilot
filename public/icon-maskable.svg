<!-- Maskable source: full-bleed background with the mark held inside the
     inner ~60% so Android's circular/squircle masks never clip it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#1E3D33"/>
  <path d="M23 42 L32 22 L41 42" fill="none" stroke="#FAF6EF" stroke-width="3.6"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M27.2 35.5 H36.8" stroke="#BE6438" stroke-width="3.6" stroke-linecap="square"/>
</svg>
