<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1628"/>
      <stop offset="100%" style="stop-color:#131F35"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ABFBF"/>
      <stop offset="100%" style="stop-color:#00E5CC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Teal glow orb -->
  <circle cx="950" cy="180" r="280" fill="#0ABFBF" opacity="0.07"/>
  <circle cx="200" cy="500" r="200" fill="#0ABFBF" opacity="0.05"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="52" height="52" rx="14" fill="url(#teal)"/>
  <text x="106" y="116" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#0C1628" text-anchor="middle">A</text>

  <!-- Wordmark -->
  <text x="148" y="117" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">Apt</text>
  <text x="196" y="117" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0ABFBF">Pilot</text>

  <!-- Headline -->
  <text x="80" y="270" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="-1">NYC Apartments.</text>
  <text x="80" y="355" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#0ABFBF" letter-spacing="-1">No Broker Fee.</text>

  <!-- Subline -->
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="26" fill="#7A8FAF">Search every listing · Book tours · Apply automatically</text>
  <text x="80" y="468" font-family="Arial, sans-serif" font-size="26" fill="#7A8FAF">One-time $399 flat fee. Save thousands.</text>

  <!-- CTA pill -->
  <rect x="80" y="510" width="220" height="52" rx="26" fill="#0ABFBF"/>
  <text x="190" y="543" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0C1628" text-anchor="middle">aptpilot.vercel.app</text>
</svg>
